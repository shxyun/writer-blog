baseURL = "https://writer.shenlijun.cn/"
defaultContentLanguage = "zh"
title = "沈立军的写作空间"
theme = "DoIt"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[languages]
  [languages.zh]
    languageCode = "zh-CN"
    languageName = "中文"
    title = "沈立军的写作空间"
    weight = 1
    [languages.zh.params]
      description = "边记边发，写作即发布"
      [languages.zh.params.author]
        name = "沈立军"
        link = ""
      [languages.zh.params.page]
        showWordCount = true
        showReadingTime = true
        showToc = true
        tocOpen = false
      [languages.zh.params.header]
        desktopMode = "fixed"
    [[languages.zh.menu.main]]
      identifier = "posts"
      name = "文章"
      url = "/zh/posts/"
      weight = 10
    [[languages.zh.menu.main]]
      identifier = "tags"
      name = "标签"
      url = "/zh/tags/"
      weight = 20
    [[languages.zh.menu.main]]
      identifier = "about"
      name = "关于"
      url = "/zh/about/"
      weight = 30

  [languages.en]
    languageCode = "en-US"
    languageName = "English"
    title = "Shen Lijun's Writing Space"
    weight = 2
    [languages.en.params]
      description = "Write and publish, writing is publishing"
      [languages.en.params.author]
        name = "Shen Lijun"
        link = ""
      [languages.en.params.page]
        showWordCount = true
        showReadingTime = true
        showToc = true
        tocOpen = false
      [languages.en.params.header]
        desktopMode = "fixed"
    [[languages.en.menu.main]]
      identifier = "posts"
      name = "Posts"
      url = "/en/posts/"
      weight = 10
    [[languages.en.menu.main]]
      identifier = "tags"
      name = "Tags"
      url = "/en/tags/"
      weight = 20
    [[languages.en.menu.main]]
      identifier = "about"
      name = "About"
      url = "/en/about/"
      weight = 30

[params]
  defaultTheme = "auto"

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true
