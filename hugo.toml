baseURL = "https://writer.shenlijun.cn/"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
hasCJKLanguage = true
title = "Shen Lijun's Writing Space"
theme = "DoIt"
enableRobotsTXT = true

[author]
  name = "Shen Lijun"
  email = "writer@shenlijun.cn"

[pagination]
  pagerSize = 10

[languages]
  [languages.en]
    languageCode = "en-US"
    languageName = "English"
    title = "Shen Lijun's Writing Space"
    weight = 1
    contentDir = "content/en"
    [languages.en.params]
      description = "Novel recommendations and reviews from web fiction platforms"
      [languages.en.params.author]
        name = "Shen Lijun"
        email = "writer@shenlijun.cn"
        gravatarEmail = "writer@shenlijun.cn"
        link = ""
      [languages.en.params.page]
        showWordCount = true
        showReadingTime = true
        showToc = true
        tocOpen = false
      [languages.en.params.header]
        desktopMode = "fixed"
    [[languages.en.menu.main]]
      identifier = "posts"
      name = "Posts"
      url = "/posts/"
      weight = 10
    [[languages.en.menu.main]]
      identifier = "tags"
      name = "Tags"
      url = "/tags/"
      weight = 20
    [[languages.en.menu.main]]
      identifier = "about"
      name = "About"
      url = "/about/"
      weight = 30

  [languages.zh]
    languageCode = "zh-CN"
    languageName = "中文"
    title = "深励君的写作空间"
    weight = 2
    contentDir = "content/zh"
    [languages.zh.params]
      description = "网文小说推荐与书评"
      [languages.zh.params.author]
        name = "深励君"
        email = "writer@shenlijun.cn"
        gravatarEmail = "writer@shenlijun.cn"
        link = ""
      [languages.zh.params.page]
        showWordCount = true
        showReadingTime = true
        showToc = true
        tocOpen = false
      [languages.zh.params.header]
        desktopMode = "fixed"
    [[languages.zh.menu.main]]
      identifier = "posts"
      name = "文章"
      url = "/zh/posts/"
      weight = 10
    [[languages.zh.menu.main]]
      identifier = "tags"
      name = "标签"
      url = "/zh/tags/"
      weight = 20
    [[languages.zh.menu.main]]
      identifier = "about"
      name = "关于"
      url = "/zh/about/"
      weight = 30

[params]
  defaultTheme = "auto"

  # Cloudflare Web Analytics
  [params.analytics]
    enable = true
    [params.analytics.cloudflare]
      token = "5aadb9ed90674e1bba97de8426002435"

[params.social]
  email = "mailto:writer@shenlijun.cn"
  github = "https://github.com/shxyun"

[params.footer]
  enable = true
  license = '<a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener noreferrer">CC BY-NC-SA 4.0</a>'

[params.page]
  editURL = "https://github.com/shxyun/writer-blog/edit/main/content/"
  [params.page.comment]
    enable = true
    [params.page.comment.giscus]
      enable = true
      repo = "shxyun/writer-blog"
      repoId = "R_kgDOU7IoSg"
      category = "Announcements"
      categoryId = "DIC_kwDOU7IoSs4DHeYg"
      lightTheme = "light"
      darkTheme = "dark"
      reactionsEnabled = 1
      emitMetadata = 0
      inputPosition = "bottom"
      lang = "en"

[languages.zh.params.page.comment.giscus]
  lang = "zh-CN"

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
