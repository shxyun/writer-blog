baseURL = "https://writer.shenlijun.cn/"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
hasCJKLanguage = true
title = "Shen Lijun's Writing Space"
theme = "DoIt"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[languages]
  [languages.en]
    languageCode = "en-US"
    languageName = "English"
    title = "Shen Lijun's Writing Space"
    weight = 1
    [languages.en.params]
      description = "Novel recommendations and reviews from web fiction platforms"
      [languages.en.params.author]
        name = "Shen Lijun"
        link = ""
      [languages.en.params.page]
        showWordCount = true
        showReadingTime = true
        showToc = true
        tocOpen = false
      [languages.en.params.header]
        desktopMode = "fixed"
    [[languages.en.menu.main]]
      identifier = "posts"
      name = "Posts"
      url = "/posts/"
      weight = 10
    [[languages.en.menu.main]]
      identifier = "tags"
      name = "Tags"
      url = "/tags/"
      weight = 20
    [[languages.en.menu.main]]
      identifier = "about"
      name = "About"
      url = "/about/"
      weight = 30

  [languages.zh]
    languageCode = "zh-CN"
    languageName = "中文"
    title = "深励君的写作空间"
    weight = 2
    [languages.zh.params]
      description = "网文小说推荐与书评"
      [languages.zh.params.author]
        name = "深励君"
        link = ""
      [languages.zh.params.page]
        showWordCount = true
        showReadingTime = true
        showToc = true
        tocOpen = false
      [languages.zh.params.header]
        desktopMode = "fixed"
    [[languages.zh.menu.main]]
      identifier = "posts"
      name = "文章"
      url = "/zh/posts/"
      weight = 10
    [[languages.zh.menu.main]]
      identifier = "tags"
      name = "标签"
      url = "/zh/tags/"
      weight = 20
    [[languages.zh.menu.main]]
      identifier = "about"
      name = "关于"
      url = "/zh/about/"
      weight = 30

[params]
  defaultTheme = "auto"

[params.social]
  email = "mailto:writer@shenlijun.cn"
  github = "https://github.com/shxyun"

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
