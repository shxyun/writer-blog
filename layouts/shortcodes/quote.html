{{ $author := .Get "author" }}
{{ $source := .Get "source" }}
<blockquote class="quote-block">
  {{ .Inner | .Page.RenderString }}
  {{ with $author }}
  <footer>&mdash; {{ . }}{{ with $source }}, <cite>{{ . }}</cite>{{ end }}</footer>
  {{ end }}
</blockquote>
<style>
.quote-block{margin:1.5em 0;padding:12px 18px;border-left:4px solid #2e5ff7;background:#f8fbff;border-radius:0 8px 8px 0;color:#333}
.quote-block footer{margin-top:8px;font-size:.9em;color:#666}
.quote-block cite{font-style:normal}
@media (prefers-color-scheme: dark){.quote-block{background:#2b313a;color:#ccc;border-left-color:#5a8aff}.quote-block footer{color:#999}}
</style>
